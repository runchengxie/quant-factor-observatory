name: Validate public observatory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install frontend dependencies
        working-directory: site
        run: npm ci
      - name: Validate public contract
        run: python -m unittest discover -s tests -v
      - name: Run public release audit
        run: python scripts/audit_public_release.py
      - name: Check published research review baseline
        run: python scripts/audit_research_updates.py --check
      - name: Build Pages site
        run: npm run build --prefix site
      - name: Install Playwright Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        id: browser_tests
        env:
          OBSERVATORY_PLAYWRIGHT_RUN_DIRECTORY: ${{ runner.temp }}/observatory-browser
        run: npm run test:e2e --prefix site
      - name: Retain failed browser diagnostics
        if: failure() && steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.sha }}
          path: ${{ runner.temp }}/observatory-browser/test-results
          retention-days: 14
          if-no-files-found: warn
